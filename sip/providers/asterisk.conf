# Asterisk / FreeSWITCH on your own LAN -- the fully self-hosted option
#
# This is the configuration to prefer if you own the PBX: no third party sees
# your signalling or media, the certificate is one you sign yourself, and the
# firewall rule can be a single LAN address rather than a provider's cloud.
#
# PBX side (Asterisk 18+, res_pjsip):
#
#   [transport-tls]
#   type=transport
#   protocol=tls
#   bind=0.0.0.0:5061
#   cert_file=/etc/asterisk/keys/pbx.pem
#   priv_key_file=/etc/asterisk/keys/pbx.key
#   method=tlsv1_2
#
#   [phone]
#   type=endpoint
#   context=internal
#   disallow=all
#   allow=ulaw,alaw
#   transport=transport-tls
#   media_encryption=sdes          ; or 'dtls' if your clients support it
#   media_encryption_optimistic=no ; mandatory, never opportunistic
#   auth=phone-auth
#   aors=phone
#
#   [phone-auth]
#   type=auth
#   auth_type=userpass
#   username=terminal7
#   password=<something long>
#
#   [phone]
#   type=aor
#   max_contacts=1
#
# Then point this config at the PBX's LAN address. Because the PBX is yours,
# `phone sip --check` will accept a self-signed certificate only if you put
# the PBX CA into the bundle (see sip/gen-certs.sh) -- never by disabling
# --tls-verify-server.
#
# Registering to a LAN address means the "provider" is 192.168.x.x: pin that
# address in the firewall with --sip-host and do not add any WAN rules at all:
#   phone firewall --sip-host 192.168.1.10 --resolver 192.168.1.1 --yes

PROVIDER_DOMAIN="192.168.1.10"
PROVIDER_REGISTRAR="sip:192.168.1.10:5061;transport=tls"
PROVIDER_REALM="asterisk"
PROVIDER_NOTE="Replace 192.168.1.10 with your PBX. Put the PBX's own CA certificate at ~/.config/phone/tls/extra-ca.pem and re-run sip/gen-certs.sh so the self-signed chain verifies; do not disable --tls-verify-server to make it work."

# checklist:
#   - PBX TLS transport listening on 5061 with method=tlsv1_2
#   - endpoint has media_encryption=sdes (or dtls) and optimistic=no
#   - aor max_contacts=1 so a second device does not steal the registration
#   - PBX CA copied to ~/.config/phone/tls/extra-ca.pem, then sip/gen-certs.sh
#   - firewall pins the PBX address only
