# Twilio Elastic SIP Trunking -- NOT verified for this configuration
#
# Twilio's Elastic SIP Trunking historically uses SIP over TLS with a
# *credential list* on port 5061, and their documentation points at
# <your-trunk>.pstn.twilio.com. What this project could not verify from a
# sandbox is (a) the current exact hostname shape and (b) whether they require
# their own CA certificate, which would need to be dropped in as
# ~/.config/phone/tls/extra-ca.pem before sip/gen-certs.sh rebuilds the bundle.
#
# Verify before trusting this block:
#   sip/test-tls.sh --host <hostname-from-your-console> --port 5061
# If the handshake fails with "unable to get local issuer certificate", do NOT
# switch verification off. Download their CA and add the bundle instead.
#
# Programmable Voice (the REST API) is a different product from Elastic SIP
# Trunking; this block is about the latter. The SMS side of Twilio is also a
# REST API, and belongs in sms.conf as a poller, not here.

PROVIDER_DOMAIN=""
PROVIDER_REGISTRAR="sip:YOUR-TRUNK.pstn.twilio.com:5061;transport=tls"
PROVIDER_REALM="YOUR-TRUNK.pstn.twilio.com"
PROVIDER_NOTE="Twilio requires a credential list on the trunk, and the phone number must be assigned to the trunk as its origination/termination URI. Their SIP hostnames are per-trunk, so there is no single default to hardcode."

# checklist:
#   - Elastic SIP Trunk created (not Programmable Voice)
#   - Credential List attached to the trunk, with a username/password inside
#   - Origination URI enabled for your number, caller ID set
#   - TLS termination enabled on the trunk
#   - run sip/test-tls.sh first: their CA or hostname may need adjusting
