# Telnyx -- SIP trunk over TLS
#
# Verified: Telnyx publishes SIP-over-TLS on port 5061 and requires the
# `;transport=tls` URI parameter. Registration is optional on Telnyx: you can
# either register a SIP connection (username + password) or authenticate by
# source IP. Registration is used here because it keeps working when your
# address changes.
#
# Setup on their side:
#   1. Create a SIP Connection of type "Credentials" (username + password),
#      not "FQDN"/"IP" -- credentials is what --username/--password need.
#   2. Enable "TLS" and "SRTP" under the connection's media/transport settings.
#   3. Attach the phone number you own to that connection as its outbound
#      caller ID.
#   4. Copy the SIP connection's username and password into provision.sh.
#
# Fill in the region hostname Telnyx shows for your connection. The common
# ones are sip.telnyx.com and sip.telnyx.eu; use what your portal says.

PROVIDER_DOMAIN="sip.telnyx.com"
PROVIDER_REGISTRAR="sip:sip.telnyx.com:5061;transport=tls"
PROVIDER_REALM="sip.telnyx.com"
PROVIDER_NOTE="Telnyx accepts both TLS and UDP on 5061/5060; this config deliberately offers only TLS, and SRTP is mandatory, so a connection without TLS+SRTP enabled will simply fail rather than fall back to plaintext."

# checklist:
#   - connection type is "Credentials" (not FQDN/IP)
#   - TLS enabled on the connection
#   - SRTP enabled / "media encryption" mandatory
#   - the DID is attached to the connection and used as outbound caller ID
#   - your public IP is either static-and-allowed or irrelevant (you register)
#   - E911 address set if you dial 911 from this line
