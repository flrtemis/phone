# Flowroute -- SIP trunk over TLS
#
# Verified: Flowroute documents SIP over TLS on sip.flowroute.com:5061 and
# authenticates registration with the sub-account's SIP credentials (the same
# username/password you use for their API, under "Technical"/"SIP credentials"
# in the portal).
#
# Setup on their side:
#   1. Create a sub-account. Its SIP username is numeric-ish and its password
#      is generated; both are on the sub-account page.
#   2. Assign the phone number to the sub-account, with the number as the
#      outbound caller ID.
#   3. Allow your IP in the sub-account's "Allowed IPs" list if you have a
#      static address; this is required for calls to be accepted even when you
#      register, and it doubles as a second factor.

PROVIDER_DOMAIN="sip.flowroute.com"
PROVIDER_REGISTRAR="sip:sip.flowroute.com:5061;transport=tls"
PROVIDER_REALM="sip.flowroute.com"
PROVIDER_NOTE="Flowroute's TLS endpoint prefers TLS 1.2+. Their media relays are addressed in SDP by hostname, so add them to the firewall too (phone sip test-tls --media-host <relay>)."

# checklist:
#   - sub-account exists with SIP credentials (not just API keys)
#   - DID assigned to that sub-account and set as caller ID
#   - your egress IP added to the sub-account's allowed list
#   - E911 address set on the DID
